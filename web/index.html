<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="M5Chainの開発を支援するブラウザーツール集です。" />
		<link rel="stylesheet" href="./styles.css" />
		<title>M5Chain Web Tools</title>
	</head>
	<body>
		<main class="shell">
			<header class="hero">
				<p class="eyebrow"><span aria-hidden="true"></span>M5Chain developer tools</p>
				<h1>Web Tools</h1>
				<p class="introduction">M5Chainの開発や動作確認に使える、ブラウザーベースのツールです。</p>
			</header>

			<section aria-labelledby="tools-title">
				<div class="section-heading">
					<h2 id="tools-title">Tools</h2>
					<p>利用するツールを選択してください。</p>
				</div>

				<div class="tool-grid">
					<a class="tool-card" href="./buzzer/">
						<div class="tool-icon" aria-hidden="true">
							<svg viewBox="0 0 48 48">
								<title>Speaker</title>
								<path d="M10 20v8h8l10 8V12L18 20h-8Z" />
								<path d="M34 18c2 1.6 3 3.6 3 6s-1 4.4-3 6" />
								<path d="M38 13c3.7 2.8 5.5 6.5 5.5 11S41.7 32.2 38 35" />
							</svg>
						</div>
						<div>
							<p class="tool-label">Audio utility</p>
							<h3>Buzzer Tone Studio</h3>
							<p>ブザーの単音やメロディを試聴し、そのまま使えるModdableコードを生成します。</p>
						</div>
						<span class="open-label">Open <span aria-hidden="true">&#8599;</span></span>
					</a>
				</div>
			</section>

			<footer>
				<p>moddable-m5chain</p>
			</footer>
		</main>
	</body>
</html>
